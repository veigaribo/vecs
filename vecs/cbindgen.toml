# This is a template cbindgen.toml file with all of the default values.
# Some values are commented out because their absence is the real default.
#
# See https://github.com/mozilla/cbindgen/blob/main/docs.md#cbindgentoml
# for detailed documentation of every option here.

language = "C"

############## Options for Wrapping the Contents of the Header #################

# header = ""
# trailer = "/* Text to put at the end of the generated file */"
include_guard = "VECS_CLIB_AUTO"
# pragma_once = true
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = false
# namespace = "my_namespace"
namespaces = []
using_namespaces = []
sys_includes = ["stdio.h"]
includes = []
no_includes = false
# cpp_compat = true
after_includes = """

#define VecsAligned(N) __attribute__((aligned(N)))
#define VecsMustUse __attribute__((warn_unused_result))

#define VecsNullString ((vecs_string_t){.str = NULL, .length = 0})
#define VecsString(Str) ((vecs_string_t){.str = (unsigned char*)(Str), .length = strlen(Str)})
#define VecsNString(Str, Len) ((vecs_string_t){.str = (unsigned char*)(Str), .length = Len})

/* Use like `printf("%.*s", VecsPrintfStringArgs(s))` */
#define VecsPrintfStringArgs(String)                                           \\
  (int)((String).length > INT_MAX ? strlen("TOO LONG") : (String).length),     \\
      (String).length > INT_MAX ? "TOO LONG" : ((char *)(String).str)

/*
* const vecs_type_t *t = vecs_component_get_type(c);
*
* VecsTypeIter(t, i) {
*   vecs_string_t typ = vecs_type_iter_get(&i);
*   // ...
* }
*/
#define VecsTypeIter(Type, Var)                                                \\
  for (vecs_type_iter_t Var = vecs_type_iter(Type);                            \\
       !vecs_type_iter_is_done(&Var); vecs_type_iter_next(&Var))
"""

############################ Code Style Options ################################

braces = "SameLine"
line_length = 86
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF" # also "CR", "CRLF", "Native"

############################# Codegen Options ##################################

style = "type"
sort_by = "None" # default for `fn.sort_by` and `const.sort_by`
usize_is_size_t = true

[defines]
# "target_os = freebsd" = "DEFINE_FREEBSD"
# "feature = serde" = "DEFINE_SERDE"

[export]
include = []
exclude = []
# prefix = "CAPI_"
item_types = []
renaming_overrides_prefixing = false

[export.rename]
"FfiVecsContextDouble" = "vecs_context_t" # shh
"FfiParseError" = "vecs_parse_error_t"
"FfiResolveError" = "vecs_resolve_error_t"
"FfiLocation" = "vecs_location_t"
"FfiString" = "vecs_string_t"
"FfiSpan" = "vecs_span_t"
"FfiTypeIter" = "vecs_type_iter_t"

"Component" = "vecs_component_t"
"TypeName" = "vecs_type_t"

[export.body]

[export.mangle]

[layout]
aligned_n = "VecsAligned"

[fn]
rename_args = "None"
must_use = "VecsMustUse"
# deprecated = "DEPRECATED_FUNC"
# deprecated_with_note = "DEPRECATED_FUNC_WITH_NOTE"
# no_return = "NO_RETURN"
# prefix = "START_FUNC"
# postfix = "END_FUNC"
args = "auto"
sort_by = "None"

[struct]
rename_fields = "None"
# must_use = "MUST_USE_STRUCT"
# deprecated = "DEPRECATED_STRUCT"
# deprecated_with_note = "DEPRECATED_STRUCT_WITH_NOTE"
rename_associated_constant = "None"
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

[enum]
rename_variants = "None"
# must_use = "MUST_USE_ENUM"
# deprecated = "DEPRECATED_ENUM"
# deprecated_with_note = "DEPRECATED_ENUM_WITH_NOTE"
add_sentinel = false
prefix_with_name = true
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
# cast_assert_name = "ASSERT"
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true
private_default_tagged_enum_constructor = false

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "None"

[macro_expansion]
bitflags = false

############## Options for How Your Rust library Should Be Parsed ##############

[parse]
parse_deps = false
include = ["vecs"]
# exclude = []
clean = false
extra_bindings = []

[parse.expand]
crates = ["vecs"]
all_features = false
default_features = true
features = []
